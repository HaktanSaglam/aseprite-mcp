name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!
        Before you start, please run **`aseprite-mcp doctor`** (from a checkout: `node bridge/bin/aseprite-mcp.js doctor`)
        and check the [troubleshooting guide](https://github.com/HaktanSaglam/aseprite-mcp/blob/main/docs/TROUBLESHOOTING.md);
        most setup problems are explained there.

        **Security problems:** please do not open a public issue. Report them privately as described in
        [SECURITY.md](https://github.com/HaktanSaglam/aseprite-mcp/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new 64x64 RGB sprite
        2. AI Assistant > Generate: "a knight with a blue cape", style 16-bit
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - In-Aseprite assistant (Chat / Generate / Animate / Tools / Settings)
        - An MCP client (Claude Code, Claude Desktop, Cursor, VS Code, Codex, ...)
        - Installation, background service or CLI
        - Something else
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: AI provider / MCP client and model
      placeholder: "Claude Code 2.1, Opus, effort high"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 26.1 / Windows 11 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: aseprite
    attributes:
      label: Aseprite version
      description: Help > About in Aseprite. Mention if it is the Steam version.
      placeholder: "1.3.18 (Steam)"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Aseprite MCP and Node.js versions
      description: "`aseprite-mcp --version` and `node --version`"
      placeholder: "1.0.0, Node 22.12.0"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `aseprite-mcp doctor`
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Bridge log
      description: |
        The terminal running the bridge, or the background service log:
        macOS `~/Library/Logs/aseprite-mcp-bridge.log`, Linux `journalctl --user -u aseprite-mcp-bridge`,
        Windows `%LOCALAPPDATA%\aseprite-mcp\bridge.log`. Remove anything private (API keys, file paths).
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or sprite
      description: A screenshot of the assistant window or the sprite helps a lot. Drag files here.
